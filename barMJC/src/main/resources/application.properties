spring.application.name=barMJC

# SQL Server (Docker: contenedor sqlserver, puerto 1433)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=barMJC;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Admin123*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA: el esquema lo gestiona Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
